# Hôte virtuel Apache (exemple pour XAMPP en local) : la racine web pointe sur public/
# À ajouter dans apache/conf/extra/httpd-vhosts.conf, puis déclarer gestion-dechets.local dans le fichier hosts.

<VirtualHost *:80>
    DocumentRoot "C:/xampp/htdocs/Gestion-Dechets/Gestions_Dechets/public"
    ServerName gestion-dechets.local
    ServerAlias www.gestion-dechets.local
    
    <Directory "C:/xampp/htdocs/Gestion-Dechets/Gestions_Dechets/public">
        AllowOverride All
        Require all granted
    </Directory>
    
    ErrorLog "logs/gestion-dechets-error.log"
    CustomLog "logs/gestion-dechets-access.log" common
</VirtualHost>


























